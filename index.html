<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <title>Frontend Mentor | QR code component - Bishounen Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <canvas id="ash-canvas"></canvas>

  <main class="qr-card">
    <div class="qr-wrapper">
      <img src="assets/images/image-qr-code.png" alt="QR Code" class="qr-image">
      <div class="qr-overlay"></div>
    </div>
    
    <div class="card-content">
      <h1>Improve your skills</h1>
      <p>Scan the code to enter the abyss and take your engineering to the next level.</p>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Matheus</a>.
  </footer>

  <script src="./js/script.js"></script>
</body>
</html>
